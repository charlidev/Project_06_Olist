name: Deploy to Databricks Prod

on:
  push:
    branches:
      - master

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  REPO_ID: "2382117841813010"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Update Databricks Git Folder
        run: |
          echo "Actualizando el repositorio de producción en Databricks..."
          databricks repos update $REPO_ID --branch master